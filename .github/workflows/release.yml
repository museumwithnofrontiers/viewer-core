name: Release

on:
  release:
    types: [published]

# id-token: write is required at the caller level: a reusable workflow's
# permissions are capped by what the caller grants, and npm trusted
# publishing exchanges this run's OIDC token for a short-lived npm
# publish credential — see package-release.yml in viewer-workflows for
# the full explanation.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/package-release.yml@v1.7.1
